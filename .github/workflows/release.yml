name: Release

on:
  workflow_dispatch:
    inputs:
      release_body:
        description: Optional Markdown body. Leave empty to auto-generate release notes.
        required: false
        type: string
        default: ""
      release_body_base64:
        description: Optional base64-encoded Markdown body for multiline content.
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  DEPENDENCY_NAME: PocketBase
  DOCKERFILE_PATH: pocketbase/Dockerfile
  DOCKERFILE_VERSION_KEY: POCKETBASE_VERSION
  RELEASE_TAG_PREFIX: v

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOT_GH_TOKEN != '' && secrets.BOT_GH_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          get_version() { grep "ARG $1=" "$DOCKERFILE_PATH" | cut -d '=' -f2 | tr -d '[:space:]'; }
          raw_version="$(get_version "$DOCKERFILE_VERSION_KEY")"

          if [ -z "$raw_version" ]; then
            echo "$DOCKERFILE_VERSION_KEY was not found in $DOCKERFILE_PATH" >&2
            exit 1
          fi

          # Keep only the first three numeric segments (X.Y.Z), dropping build/release suffixes.
          if [[ "$raw_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([.-].*)?$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "$DOCKERFILE_VERSION_KEY must include a semver base X.Y.Z. Found: $raw_version" >&2
            exit 1
          fi

          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${version##*.}"

          candidate="${RELEASE_TAG_PREFIX}${version}"
          incremented="false"

          while git ls-remote --exit-code --tags origin "refs/tags/${candidate}" >/dev/null 2>&1; do
            patch=$((patch + 1))
            candidate="${RELEASE_TAG_PREFIX}${major}.${minor}.${patch}"
            incremented="true"
          done

          echo "raw_version=$raw_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$candidate" >> "$GITHUB_OUTPUT"
          echo "tag_incremented=$incremented" >> "$GITHUB_OUTPUT"

      - name: Prepare release body
        id: release_body
        shell: bash
        env:
          RELEASE_BODY: ${{ github.event.inputs.release_body }}
          RELEASE_BODY_BASE64: ${{ github.event.inputs.release_body_base64 }}
          RAW_VERSION: ${{ steps.version.outputs.raw_version }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          extra=""
          body=""
          body_mode="auto"
          tag_version="${RELEASE_TAG#${RELEASE_TAG_PREFIX}}"

          if [ -n "${RELEASE_BODY_BASE64//[[:space:]]/}" ]; then
            extra="$(printf '%s' "$RELEASE_BODY_BASE64" | base64 --decode)"
            body_mode="base64"
          elif [ -n "${RELEASE_BODY//[[:space:]]/}" ]; then
            extra="$RELEASE_BODY"
            body_mode="input"
          fi

          if [ "$tag_version" != "$RAW_VERSION" ]; then
            increment_note="_Published tag was incremented because ${RELEASE_TAG_PREFIX}${VERSION} already exists._"
            if [ -n "$extra" ]; then
              body="$(printf '%s\n\n%s' "$increment_note" "$extra")"
            else
              body="$increment_note"
            fi
          else
            body="$extra"
          fi

          {
            echo "body<<EOF"
            printf '%s\n' "$body"
            echo "EOF"
            echo "body_mode=$body_mode"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        uses: actions/github-script@v9
        env:
          RELEASE_BODY: ${{ steps.release_body.outputs.body }}
          BODY_MODE: ${{ steps.release_body.outputs.body_mode }}
          DEPENDENCY_NAME: ${{ env.DEPENDENCY_NAME }}
        with:
          github-token: ${{ env.GH_TOKEN }}
          script: |
            const releaseBody = (process.env.RELEASE_BODY || '').trim();
            const bodyMode = process.env.BODY_MODE || 'auto';
            const releaseTag = '${{ steps.version.outputs.release_tag }}';
            const rawVersion = '${{ steps.version.outputs.raw_version }}';
            const dependencyName = process.env.DEPENDENCY_NAME;
            const tagVersion = releaseTag.replace(/^v/, '');
            const releaseName = tagVersion === rawVersion
              ? releaseTag
              : `${releaseTag} (${dependencyName}: v${rawVersion})`;

            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: releaseTag,
              name: releaseName,
              draft: false,
              prerelease: false,
              generate_release_notes: bodyMode === 'auto',
            };

            if (releaseBody.length > 0) {
              payload.body = releaseBody;
            }

            const release = await github.rest.repos.createRelease(payload);
            core.setOutput('html_url', release.data.html_url);
            core.setOutput('id', String(release.data.id));

      - name: Publish release summary
        shell: bash
        run: |
          {
            echo "## Release created"
            echo ""
            echo "- $DEPENDENCY_NAME: \`${{ steps.version.outputs.raw_version }}\`"
            echo "- Base $DOCKERFILE_VERSION_KEY: \`${{ steps.version.outputs.version }}\`"
            echo "- Published tag: \`${{ steps.version.outputs.release_tag }}\`"
            echo "- Tag incremented: \`${{ steps.version.outputs.tag_incremented }}\`"
            echo "- Body mode: \`${{ steps.release_body.outputs.body_mode }}\`"
            echo "- Release ID: \`${{ steps.create_release.outputs.id }}\`"
            echo "- URL: ${{ steps.create_release.outputs.html_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

